schema_version = "1.0.0"

id = "gamut_viewer"
version = "0.1.0"
name = "Gamut Viewer"
tagline = "See a render's colours in 3D against screen and print gamuts"
maintainer = "Tiphaine Buccino"
type = "add-on"
website = "https://github.com/fitaine/Blender-Gamut"
tags = ["Render", "3D View"]

blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]

platforms = ["windows-x64", "macos-arm64", "macos-x64", "linux-x64"]

# Pillow, for its bundled LittleCMS colour engine. tools/build.py downloads these.
wheels = [
  "./wheels/pillow-12.3.0-cp311-cp311-win_amd64.whl",
  "./wheels/pillow-12.3.0-cp313-cp313-win_amd64.whl",
  "./wheels/pillow-12.3.0-cp311-cp311-macosx_11_0_arm64.whl",
  "./wheels/pillow-12.3.0-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/pillow-12.3.0-cp311-cp311-macosx_10_10_x86_64.whl",
  "./wheels/pillow-12.3.0-cp313-cp313-macosx_10_13_x86_64.whl",
  "./wheels/pillow-12.3.0-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/pillow-12.3.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
]

[permissions]
files = "Read ICC profiles and write a temporary copy of the render"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "*.zip",
]
